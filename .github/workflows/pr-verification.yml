name: PR Verification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read
  issues: read

concurrency:
  group: pr-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: PR Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - name: Install frozen dependencies
        run: npm ci
      - name: Verify Supabase migration and RLS
        shell: bash
        run: |
          bash supabase/tests/site_settings_rls.sh
          bash supabase/tests/legal_pages_rls.sh
          python3 -B supabase/tests/community/run_ci.py
      - name: Enforce bounded change size
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_ref="origin/${{ github.base_ref }}"
          else
            base_ref="origin/main"
          fi
          npm run verify:change-size -- "$base_ref"
      - name: Verify code
        run: npm run verify
      - name: Verify first-response SSR and rendered Home journey
        shell: bash
        run: |
          node --input-type=module <<'NODE' > /tmp/settings-fixture.log 2>&1 &
          import http from "node:http";
          const settingBody = JSON.stringify([{ setting_value: "https://example.test/book" }]);
          const legalBody = JSON.stringify([{
            slug: "disclaimer",
            title: "Disclaimer",
            body_jsonb: [
              "Becoming the Man She Can Trust and the Love | Purpose | Flourish Relationship Operating System are educational frameworks designed to support reflection, communication, trust, responsibility, boundaries, repair, and healthier relationship behavior.",
              "The information, principles, tools, examples, and guidance presented on this website are for educational and informational purposes only. They are not a substitute for individualized medical, mental-health, legal, therapeutic, or other professional advice, diagnosis, or treatment. When circumstances require professional support, readers and users should seek assistance from an appropriately qualified professional.",
              "The framework does not guarantee reconciliation, attraction, commitment, sexual intimacy, relationship preservation, or any particular personal or relationship outcome. Individual circumstances differ, and users remain responsible for their own decisions, boundaries, safety, and actions.",
              "Nothing in this framework should be used to justify manipulation, coercion, surveillance, retaliation, sexual entitlement, abuse, or control. When a situation involves violence, coercive control, stalking, threats, sexual assault, suicidality, severe crisis, or immediate danger, personal safety and qualified professional or emergency support take priority over ordinary relationship guidance."
            ]
          }]);
          http.createServer((req, res) => {
            const body = req.url?.startsWith("/rest/v1/legal_pages") ? legalBody : settingBody;
            res.writeHead(200, { "content-type": "application/json" });
            res.end(body);
          }).listen(54321, "127.0.0.1");
          NODE
          fixture_pid=$!
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:54321/health > /dev/null; then
              break
            fi
            sleep 0.1
          done
          SUPABASE_URL=http://127.0.0.1:54321 SUPABASE_PUBLISHABLE_KEY=ci-test npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/ssr.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" "$fixture_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ > /tmp/home.html; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/book > /tmp/book.html
          curl -fsS http://127.0.0.1:4173/disclaimer > /tmp/disclaimer.html
          grep -F '<h1>Becoming the Man She Can Trust</h1>' /tmp/home.html
          grep -F 'href="/book"' /tmp/home.html
          grep -F 'href="https://example.test/book"' /tmp/home.html
          grep -F 'href="/disclaimer"' /tmp/home.html
          grep -F 'BOOK ORIENTATION' /tmp/book.html
          grep -F 'href="/"' /tmp/book.html
          grep -F '<h1 id="disclaimer-title">DISCLAIMER</h1>' /tmp/disclaimer.html
          grep -F 'educational and informational purposes only' /tmp/disclaimer.html
          grep -F 'personal safety and qualified professional or emergency support take priority' /tmp/disclaimer.html
          node scripts/verify-home-responsive.mjs http://127.0.0.1:4173/
          npm run scout:mobile -- http://127.0.0.1:4173/ --out-dir /tmp/mobile-scout --no-screenshots
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";

          const report = JSON.parse(await readFile("/tmp/mobile-scout/mobile-scout-report.json", "utf8"));
          const normalize = (items) => items.map((item) => ({
            text: item.text.trim().replace(/\s+/g, " ").toUpperCase(),
            href: item.href,
            disabled: item.disabled === true,
          }));
          const expected = [
            { text: "BOOK", href: "/book", disabled: false },
            { text: "THE 24 NON-NEGOTIABLES", href: "#non-negotiables", disabled: false },
            { text: "ABOUT", href: null, disabled: true },
            { text: "CONTACT", href: null, disabled: true },
            { text: "NEWSLETTER", href: "#community", disabled: false },
          ];

          if (JSON.stringify(normalize(report.desktopBaseline.primaryNavigationItems)) !== JSON.stringify(expected)) {
            throw new Error("Desktop primary navigation changed from the governed five-item contract.");
          }
          if (report.desktopBaseline.footerPrimaryNavigationItems.length !== 0) {
            throw new Error("Primary navigation remains in the footer.");
          }
          for (const snapshot of report.mobileSnapshots) {
            if (!snapshot.mobileNavReplacementVisible || !snapshot.mobileNavigationOpened) {
              throw new Error(`Mobile navigation did not render and open at ${snapshot.viewport.width}px.`);
            }
            if (snapshot.footerPrimaryNavigationItems.length !== 0) {
              throw new Error(`Footer primary navigation remains at ${snapshot.viewport.width}px.`);
            }
            if (JSON.stringify(normalize(snapshot.mobileNavigationItems)) !== JSON.stringify(expected)) {
              throw new Error(`Mobile navigation content drifted at ${snapshot.viewport.width}px.`);
            }
            if (!snapshot.headerRect || !snapshot.mobileNavTriggerRect || !snapshot.mobileNavPanelRect) {
              throw new Error(`Mobile navigation geometry is missing at ${snapshot.viewport.width}px.`);
            }
            if (Math.abs(snapshot.headerRect.right - snapshot.mobileNavTriggerRect.right) > 1) {
              throw new Error(`Mobile navigation trigger is not anchored to the header right edge at ${snapshot.viewport.width}px.`);
            }
            if (snapshot.mobileNavPanelRect.left < -1 || snapshot.mobileNavPanelRect.right > snapshot.viewport.width + 1) {
              throw new Error(`Mobile navigation panel overflows the viewport at ${snapshot.viewport.width}px.`);
            }
          }
          console.log("PASS: Mobile header navigation replaces the removed footer navigation at all governed phone widths.");
          NODE
      - name: Bind evidence to tested SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          tested_sha="$(git rev-parse HEAD)"
          test "$tested_sha" = "$EXPECTED_SHA"
          echo "PASS: PR Verification tested exact SHA $tested_sha"
