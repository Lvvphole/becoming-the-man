name: PR Verification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:

permissions:
  contents: read
  issues: read

concurrency:
  group: pr-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: PR Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.16.0
          cache: npm

      - name: Enforce bounded change size
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: npm run verify:change-size -- "origin/${{ github.base_ref }}"

      - name: Run canonical production verification
        env:
          EXPECTED_CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          VERIFY_TRUSTED_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          VERIFY_PR_MERGE_CANDIDATE: "0"
        run: bash scripts/verify-production.sh

      - name: Verify first-response SSR
        shell: bash
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/ssr.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ > /tmp/home.html; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/book > /tmp/book.html
          grep -F '<h1>Becoming the Man She Can Trust</h1>' /tmp/home.html
          grep -F 'href="/book"' /tmp/home.html
          grep -F 'BOOK ORIENTATION' /tmp/book.html
          grep -F 'href="/"' /tmp/book.html

      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr-verification-${{ github.event.pull_request.head.sha || github.sha }}
          path: verification-reports/*.md
          if-no-files-found: warn
          retention-days: 14
