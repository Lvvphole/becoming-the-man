name: PR Verification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:

permissions:
  contents: read

concurrency:
  group: pr-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: PR Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - name: Install frozen dependencies
        run: npm ci
      - name: Enforce bounded change size
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_ref="origin/${{ github.base_ref }}"
          else
            base_ref="origin/main"
          fi
          npm run verify:change-size -- "$base_ref"
      - name: Verify code
        run: npm run verify
      - name: Verify first-response SSR
        shell: bash
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/ssr.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ > /tmp/home.html; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/book > /tmp/book.html
          grep -F '<h1>Becoming the Man She Can Trust</h1>' /tmp/home.html
          grep -F 'href="/book"' /tmp/home.html
          grep -F 'BOOK ORIENTATION' /tmp/book.html
          grep -F 'href="/"' /tmp/book.html
      - name: Bind evidence to tested SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          tested_sha="$(git rev-parse HEAD)"
          test "$tested_sha" = "$EXPECTED_SHA"
          echo "PASS: PR Verification tested exact SHA $tested_sha"
