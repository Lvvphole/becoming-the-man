name: Trusted PR Verification

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: read

concurrency:
  group: trusted-pr-verification-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Trusted PR Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted base controls
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: trusted

      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: candidate

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: candidate/package-lock.json

      - name: Enforce bounded change size from trusted base
        working-directory: candidate
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: bash ../trusted/scripts/check-change-size.sh "${{ github.event.pull_request.base.sha }}"

      - name: Run trusted verification authority
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p trusted-evidence
          set -o pipefail
          bash trusted/.github/trusted/verify-candidate.sh candidate \
            | tee "trusted-evidence/trusted-verification-${EXPECTED_HEAD_SHA}.log"

      - name: Preserve trusted verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trusted-pr-verification-${{ github.event.pull_request.head.sha }}
          path: trusted-evidence/*.log
          if-no-files-found: warn
          retention-days: 14
